name: run-background-jobs
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and process durable jobs
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          INTERNAL_JOB_TOKEN: ${{ secrets.INTERNAL_JOB_TOKEN }}
        run: curl --retry 4 --retry-all-errors --max-time 720 --fail --silent --show-error --request POST --header "Authorization: Bearer ${INTERNAL_JOB_TOKEN}" "${API_ORIGIN%/}/v1/internal/jobs/run"
