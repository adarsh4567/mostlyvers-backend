name: run-background-jobs
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and process durable jobs
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          INTERNAL_JOB_TOKEN: ${{ secrets.INTERNAL_JOB_TOKEN }}
        run: |
          if [ -z "$API_ORIGIN" ] || [ -z "$INTERNAL_JOB_TOKEN" ]; then
            echo "API_ORIGIN and INTERNAL_JOB_TOKEN are not configured; skipping."
            exit 0
          fi
          curl --retry 4 --retry-all-errors --max-time 720 --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${INTERNAL_JOB_TOKEN}" \
            "${API_ORIGIN%/}/v1/internal/jobs/run"
