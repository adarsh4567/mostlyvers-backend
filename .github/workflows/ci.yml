name: backend-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.x', cache-dependency-path: go.sum }
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api
