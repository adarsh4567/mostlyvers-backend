services:
  - type: web
    name: mostlyvers-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: BILLING_MODE
        value: FREE_LAUNCH
      - key: EMAIL_PROVIDER
        value: emailjs
      - key: EMAIL_OTP_REQUIRED
        value: "true"
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: PLAY_INTEGRITY_REQUIRED
        value: "false"
      - key: ANDROID_PACKAGE_NAME
        value: com.mostlyvers.app
      - key: READER_RESET_URL
        value: mostlyvers://reset-password
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_PRIVATE_KEY_BASE64
        sync: false
      - key: CONTENT_KEY_ENCRYPTION_KEY_BASE64
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_PUBLIC_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_SOFT_LIMIT_BYTES
        value: "891289600"
      - key: STORAGE_HARD_LIMIT_BYTES
        value: "996147200"
      - key: MAX_EPUB_UPLOAD_BYTES
        value: "52428800"
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: INTERNAL_JOB_TOKEN
        sync: false
