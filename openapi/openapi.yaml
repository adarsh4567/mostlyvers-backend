    DeviceContext: { type: object, required: [installationId, displayName, platform, osVersion, appVersion, packageName], properties: {installationId: {type: string}, displayName: {type: string}, platform: {type: string, const: ANDROID}, osVersion: {type: string}, appVersion: {type: string}, packageName: {type: string}, integrityToken: {type: string}, integrityRequestHash: {type: string}} }
    ReaderSession: { type: object, required: [accessToken, accessTokenExpiresAt, refreshToken, reader, accessMode, deviceAccess], properties: {accessToken: {type: string}, accessTokenExpiresAt: {type: string, format: date-time}, refreshToken: {type: string}, reader: {type: object, additionalProperties: true}, accessMode: {enum: [FULL, BROWSE_ONLY]}, deviceAccess: {type: object, additionalProperties: true}} }
    CursorPage: { type: object, required: [items], properties: {items: {type: array, items: {}}, nextCursor: {type: [string, 'null']}, total: {type: integer}} }
    ErrorEnvelope: { type: object, required: [error], properties: {error: {type: object, required: [code, message, requestId], properties: {code: {type: string}, message: {type: string}, requestId: {type: string}, details: {type: object, additionalProperties: true}}}} }
