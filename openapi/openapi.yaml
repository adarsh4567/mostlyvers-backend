      properties:
        title: { type: string, minLength: 1 }
        contentUploadRef: { type: string, format: uuid }
        coverUploadRef: { type: string }
        shortDescription: { type: string }
        publicationMonth: { type: integer, minimum: 1, maximum: 12 }
        publicationYear: { type: integer, minimum: 2000 }
        youtubeAsset:
          type: object
